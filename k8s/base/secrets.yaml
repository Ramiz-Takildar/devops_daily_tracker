# Kubernetes Secrets for DevOps Tracker
# IMPORTANT: In production, use external secrets management (AWS Secrets Manager, HashiCorp Vault, etc.)
# 
# To generate base64 encoded values:
# echo -n "your_value" | base64
#
# Example values (CHANGE THESE IN PRODUCTION):
# echo -n "devops_user" | base64  -> ZGV2b3BzX3VzZXI=
# echo -n "devops_pass" | base64  -> ZGV2b3BzX3Bhc3M=
# echo -n "your_super_secret_jwt_key_change_this_in_production_12345" | base64

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devops-tracker
type: Opaque
data:
  # Database credentials (base64 encoded)
  DB_USER: ZGV2b3BzX3VzZXI=                    # devops_user
  DB_PASSWORD: ZGV2b3BzX3Bhc3M=                # devops_pass
  
  # JWT Secret (base64 encoded)
  # IMPORTANT: Generate a strong random secret for production
  JWT_SECRET: eW91cl9zdXBlcl9zZWNyZXRfand0X2tleV9jaGFuZ2VfdGhpc19pbl9wcm9kdWN0aW9uXzEyMzQ1
  
---
# Optional: Separate secret for PostgreSQL superuser password
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
data:
  # PostgreSQL password (base64 encoded)
  POSTGRES_PASSWORD: ZGV2b3BzX3Bhc3M=          # devops_pass
