# Frontend Service for DevOps Tracker
# LoadBalancer service for external access (use NodePort for Minikube/Kind)

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
    component: web
spec:
  type: LoadBalancer  # Change to NodePort for Minikube/Kind if LoadBalancer is not available
  ports:
  - port: 3000
    targetPort: 80
    protocol: TCP
    name: http
    # nodePort: 30000  # Uncomment for NodePort type (range: 30000-32767)
  selector:
    app: frontend
  # Session affinity for consistent user sessions
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour

---
