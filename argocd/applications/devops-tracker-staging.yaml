apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-tracker-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-tracker
  
  source:
    repoURL: 'https://github.com/Ramiz-Takildar/devops_daily_tracker'
    targetRevision: staging
    path: k8s/overlays/staging
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-tracker-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Manual approval for staging
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
