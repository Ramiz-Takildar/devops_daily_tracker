apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-tracker-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devops-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: devops-alerts
spec:
  project: devops-tracker
  
  source:
    repoURL: 'https://github.com/Ramiz-Takildar/devops_daily_tracker'
    targetRevision: main
    path: k8s/overlays/production
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-tracker-prod
  
  syncPolicy:
    automated:
      prune: false     # Manual pruning for production
      selfHeal: false  # Manual sync for production
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  
  revisionHistoryLimit: 20
